name: Time4o SPA
on:
  push:
    branches: ["**"]
    paths:
      - "spa/**"
      - "web/js/liveresults*.js"
      - ".github/workflows/spa.yml"
  workflow_dispatch:

concurrency:
  group: spa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
